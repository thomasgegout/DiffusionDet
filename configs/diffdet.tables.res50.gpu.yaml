_BASE_: "Base-DiffusionDet.yaml"
MODEL:
  WEIGHTS: "models/diffdet_coco_res50_300boxes.pth"
  DEVICE: "gpu"
  RESNETS:
    DEPTH: 50
    STRIDE_IN_1X1: False
  DiffusionDet:
    NUM_PROPOSALS: 500 
    NUM_CLASSES: 6
DATASETS:
  TRAIN: ("pubtables_train",)
  TEST:  ("pubtables_val",)
SOLVER:
  IMS_PER_BATCH: 1    
  BASE_LR: 0.0001     # Lower learning rate for fine-tuning
  STEPS: (10000, 15000)
  MAX_ITER: 2000     # Fewer iterations for initial testing
  WARMUP_ITERS: 100
  CHECKPOINT_PERIOD: 500
INPUT:
  CROP:
    ENABLED: True
  FORMAT: "RGB"
OUTPUT_DIR: "./output_tables"