_BASE_: "Base-DiffusionDet.yaml"
MODEL:
  WEIGHTS: "output_tables/model_finetuned.pth"
  DEVICE: "cuda"
  RESNETS:
    DEPTH: 50
    STRIDE_IN_1X1: False
  DiffusionDet:
    NUM_PROPOSALS: 300 
    NUM_CLASSES: 4
DATASETS:
  TRAIN: ("docugami_train",)
  TEST:  ("docugami_val_test",)
SOLVER:
  IMS_PER_BATCH: 32
  BASE_LR: 0.000020
  MAX_ITER: 10000
  WARMUP_ITERS: 100
  WARMUP_FACTOR: 0.1  # Better warmup factor
  WARMUP_METHOD: "linear"  # Better warmup method
  CHECKPOINT_PERIOD: 200
  # Optimizer settings
  OPTIMIZER: "ADAMW"
  WEIGHT_DECAY: 0.0001
  MOMENTUM: 0.9
  # Better LR scheduling
  GAMMA: 0.1  # LR decay factor
  # Disable Detectron2 AMP since we're using DeepSpeed BF16
  AMP:
    ENABLED: True
  # Gradient clipping for training stability
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 1.0
    NORM_TYPE: 2.0
# Disable EMA for DeepSpeed compatibility
MODEL_EMA:
  ENABLED: False
  DECAY: 0.999
OUTPUT_DIR: "./output_tables"
DATALOADER:
  NUM_WORKERS: 32  # Reduced from 64 to prevent multiprocessing issues
  ASPECT_RATIO_GROUPING: True  # Group similar aspect ratios for efficiency
  FILTER_EMPTY_ANNOTATIONS: False
TEST:
  EVAL_PERIOD: 200