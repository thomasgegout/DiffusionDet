_BASE_: "Base-DiffusionDet.yaml"
MODEL:
  WEIGHTS: "models/diffdet_coco_res50_300boxes.pth"
  DEVICE: "cuda"
  RESNETS:
    DEPTH: 50
    STRIDE_IN_1X1: False
  DiffusionDet:
    NUM_PROPOSALS: 300 
    NUM_CLASSES: 6
DATASETS:
  TRAIN: ("pubtables_train",)
  TEST:  ("pubtables_val",)
SOLVER:
  IMS_PER_BATCH: 18
  BASE_LR: 0.0001
  STEPS: (350000, 420000)
  MAX_ITER: 450000
  WARMUP_ITERS: 1000
  WARMUP_FACTOR: 0.01
  CHECKPOINT_PERIOD: 200
INPUT:
  CROP:
    ENABLED: True
  FORMAT: "RGB"
OUTPUT_DIR: "./output_tables"
DATALOADER:
  NUM_WORKERS: 108
TEST:
  EVAL_PERIOD: 5000